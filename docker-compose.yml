services:
  homeassistant:
    container_name: homeassistant-test
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./test_config:/config
      - ./custom_components:/config/custom_components
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Phoenix
    ports:
      - "8123:8123"
    restart: unless-stopped
    network_mode: bridge
